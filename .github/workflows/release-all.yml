name: Build and release all KOReader toolchains

# Manual only: builds the Rust core with every KOReader koxtoolchain (2026.08)
# and publishes one GitHub Release with one plugin ZIP per toolchain.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark this GitHub Release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  KOXTOOLCHAIN_VERSION: "2026.08"

jobs:
  test:
    name: Validate tag and run native tests
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Use a new tag."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run native tests
        working-directory: yumanga_core
        run: |
          cargo test --locked
          cargo test --locked --features aidoku-runtime

  build:
    name: Build ${{ matrix.toolchain }}
    needs: test
    runs-on: ubuntu-latest
    # Experimental toolchains may fail (very old glibc / soft-float ABI)
    # without blocking the release of the other ones.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Stable: sysroot glibc >= 2.17 (Rust std + ring need getauxval), dynamic glibc build ---
          - toolchain: kindlehf
            cross_prefix: arm-kindlehf-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 8cc7dfbd71abd78f9e947d6b2e20670288a4402edc7b07176bca791f7eaf87d0
            experimental: false
          - toolchain: kobov4
            cross_prefix: arm-kobov4-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 42baff346352f1e31de427245adcab39d85be4ba935b72da1605d09e4a15a8ef
            experimental: false
          - toolchain: kobov5
            cross_prefix: arm-kobov5-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: a9eba0aaf17e5cc94fdabb46c2ae06d9bb41936b869ea6479d325c9f79b14a64
            experimental: false
          - toolchain: nickel
            cross_prefix: arm-nickel-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 7583564ef5d75d15558206c7b04db02a8113a772cf7fd090f4ad4bb4890efea2
            experimental: false
          - toolchain: pocketbookhf
            cross_prefix: arm-pocketbookhf-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 0e961fade5c8d44e6152443c839528cc4702e0bc1ae74dbde92946d552767830
            experimental: false
          - toolchain: remarkable
            cross_prefix: arm-remarkable-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 4f8f68d1c1836af4c1166baa5826ad674ffe48a527c1d6e8613f8ecdc784d477
            experimental: false
          # --- Stable: AArch64 ---
          - toolchain: remarkable-aarch64
            cross_prefix: aarch64-remarkable-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            sha256: 4b00e0351a702d37be5ae660d9077d9ae3da22e5145e28d8089f193f325f446a
            experimental: false
          # --- Experimental: sysroot glibc < 2.16 (no getauxval) ---
          # Rust std and ring call getauxval(), which these sysroots lack. First try a normal
          # dynamic glibc build with a tiny getauxval shim linked in (reads /proc/self/auxv).
          # If that fails, fall back to a static musl build using the same GCC as linker.
          - toolchain: kobo
            cross_prefix: arm-kobo-linux-gnueabihf
            rust_target: armv7-unknown-linux-gnueabihf
            sha256: 326dd2a2a5ca371073c4ebc783d578f93f4122d83c46b84ec85b9e3ed5ff2305
            shim: true
            fallback_target: armv7-unknown-linux-musleabihf
            experimental: true
          - toolchain: kindlepw2
            cross_prefix: arm-kindlepw2-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 84bc8b4143796ba0c9e6306aefc596ca2e2685cf9174a285bb14f36425de8104
            shim: true
            fallback_target: armv7-unknown-linux-musleabi
            experimental: true
          - toolchain: kindle5
            cross_prefix: arm-kindle5-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 4f519d30c6b041ba3e8a34f2b62437232b8b27e672c1b892c8d350c0f7706c98
            shim: true
            fallback_target: armv7-unknown-linux-musleabi
            experimental: true
          - toolchain: kindle
            cross_prefix: arm-kindle-linux-gnueabi
            rust_target: arm-unknown-linux-gnueabi
            sha256: 4aa5751f5e29268d91999d4754d14ce0d6db5510e46b26bd7b2a8ce25fe09ad8
            shim: true
            fallback_target: arm-unknown-linux-musleabi
            experimental: true
          - toolchain: cervantes
            cross_prefix: arm-cervantes-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 2f78a14dd36f7e915634ff8ac6e29f1e7d2db5b59da292b3401c2a1165c8b700
            shim: true
            fallback_target: armv7-unknown-linux-musleabi
            experimental: true
          - toolchain: pocketbook
            cross_prefix: arm-pocketbook-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: 3dbd22d7f3f485681ca9e4baef7ed463f540ffeca88fa38ffc51b6d336ec2112
            shim: true
            fallback_target: armv7-unknown-linux-musleabi
            experimental: true
          - toolchain: bookeen
            cross_prefix: arm-bookeen-linux-gnueabi
            rust_target: armv7-unknown-linux-gnueabi
            sha256: b087934eb1fc4e13d988bc7571755a08a227b67579e110416ba7931caad2cf36
            shim: true
            fallback_target: armv7-unknown-linux-musleabi
            experimental: true
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      CROSS_PREFIX: ${{ matrix.cross_prefix }}
      RUST_TARGET: ${{ matrix.rust_target }}
      FALLBACK_TARGET: ${{ matrix.fallback_target }}
      USE_SHIM: ${{ matrix.shim }}
      TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd zip

      - name: Install KOReader ${{ matrix.toolchain }} toolchain
        run: |
          archive="$RUNNER_TEMP/${TOOLCHAIN}.tar.zst"
          curl --fail --location --retry 3 \
            "https://github.com/koreader/koxtoolchain/releases/download/${KOXTOOLCHAIN_VERSION}/${TOOLCHAIN}.tar.zst" \
            --output "$archive"
          echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum --check --status
          tar --zstd --extract --file "$archive" --directory "$HOME"
          echo "$HOME/x-tools/${CROSS_PREFIX}/bin" >> "$GITHUB_PATH"
          "$HOME/x-tools/${CROSS_PREFIX}/bin/${CROSS_PREFIX}-gcc" --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}${{ matrix.fallback_target && format(',{0}', matrix.fallback_target) || '' }}

      - name: Configure cross-compilation environment
        run: |
          for target in "$RUST_TARGET" "$FALLBACK_TARGET"; do
            [[ -n "$target" ]] || continue
            lower="${target//-/_}"
            upper="$(echo "$lower" | tr '[:lower:]' '[:upper:]')"
            {
              echo "CARGO_TARGET_${upper}_LINKER=${CROSS_PREFIX}-gcc"
              echo "CC_${lower}=${CROSS_PREFIX}-gcc"
              echo "AR_${lower}=${CROSS_PREFIX}-ar"
            } >> "$GITHUB_ENV"
          done

      - name: Build getauxval shim (sysroot glibc < 2.16)
        if: matrix.shim
        run: |
          cat > "$RUNNER_TEMP/getauxval_shim.c" <<'SHIM_EOF'
          /* getauxval() for glibc < 2.16. Reads /proc/self/auxv and follows glibc's
             contract: returns 0 and sets errno=ENOENT when the entry is missing. */
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <unistd.h>

          unsigned long getauxval(unsigned long type)
          {
              unsigned long entry[2];
              unsigned long value = 0;
              int saved_errno = errno;
              int found = 0;
              int fd = open("/proc/self/auxv", O_RDONLY | O_CLOEXEC);

              if (fd < 0) {
                  errno = ENOENT;
                  return 0;
              }
              while (read(fd, entry, sizeof entry) == (ssize_t)sizeof entry) {
                  if (entry[0] == 0) /* AT_NULL */
                      break;
                  if (entry[0] == type) {
                      value = entry[1];
                      found = 1;
                      break;
                  }
              }
              close(fd);
              errno = found ? saved_errno : ENOENT;
              return value;
          }
          SHIM_EOF
          "${CROSS_PREFIX}-gcc" -O2 -fPIC -Wall -Wextra \
            -c "$RUNNER_TEMP/getauxval_shim.c" -o "$RUNNER_TEMP/getauxval_shim.o"

      - name: Cross-compile core (${{ matrix.rust_target }})
        id: build_primary
        working-directory: yumanga_core
        # With a fallback target, a failure here is not fatal; the next step handles it.
        continue-on-error: ${{ matrix.fallback_target != '' }}
        run: |
          if [[ "$USE_SHIM" == "true" ]]; then
            export RUSTFLAGS="-C link-arg=${RUNNER_TEMP}/getauxval_shim.o"
          fi
          cargo build --locked --release --features aidoku-runtime --target "$RUST_TARGET"

      - name: Fallback - static musl build (${{ matrix.fallback_target }})
        id: build_fallback
        if: steps.build_primary.outcome == 'failure'
        working-directory: yumanga_core
        run: cargo build --locked --release --features aidoku-runtime --target "$FALLBACK_TARGET"

      - name: Package plugin ZIP
        env:
          PRIMARY_OUTCOME: ${{ steps.build_primary.outcome }}
        run: |
          if [[ "$PRIMARY_OUTCOME" == "success" ]]; then
            target="$RUST_TARGET"
            if [[ "$USE_SHIM" == "true" ]]; then
              variant="dynamic glibc build with getauxval shim"
            else
              variant="dynamic glibc build"
            fi
          else
            target="$FALLBACK_TARGET"
            variant="static musl build"
          fi

          binary="yumanga_core/target/${target}/release/yumanga_core"
          test -x "$binary"
          file "$binary" | tee "$RUNNER_TEMP/binary-info.txt"
          grep -Eiq 'ARM|aarch64' "$RUNNER_TEMP/binary-info.txt"

          stage="$RUNNER_TEMP/package/yumanga.koplugin"
          mkdir -p "$stage/bin" dist
          cp yumanga.koplugin/_meta.lua yumanga.koplugin/main.lua "$stage/"
          cp -a yumanga.koplugin/lib "$stage/lib"
          install -m 755 "$binary" "$stage/bin/yumanga_core_dev"

          archive="YuMangaDownloader-${RELEASE_TAG}-${TOOLCHAIN}.zip"
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/dist/$archive" yumanga.koplugin)
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          echo "${TOOLCHAIN}: ${variant} (${target})" > "dist/${archive}.info"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.toolchain }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist

      - name: Write release notes and combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          {
            echo "Built with [KOReader koxtoolchain ${KOXTOOLCHAIN_VERSION}](https://github.com/koreader/koxtoolchain/releases/tag/${KOXTOOLCHAIN_VERSION})."
            echo
            echo "Install the ZIP that matches your device's KOReader toolchain, then copy the \`yumanga.koplugin\` folder into KOReader's \`plugins\` directory. See the README for the device-to-toolchain table."
            echo
            echo "Toolchains in this release:"
            for f in YuMangaDownloader-*.zip.info; do
              echo "- $(cat "$f")"
            done
          } > ../release-notes.md
          ls -l

      - name: Create GitHub Release
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "YuManga Downloader $RELEASE_TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            "${args[@]}" \
            dist/YuMangaDownloader-*.zip \
            dist/SHA256SUMS
